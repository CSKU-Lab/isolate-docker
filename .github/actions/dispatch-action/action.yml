name: Trigger Repository Dispatch
description: Trigger another repo's GitHub Actions workflow
inputs:
  token:
    required: true
    description: GitHub PAT with repo access
  repo:
    required: true
    description: Target repo (e.g., my-org/other-repo)
  event_type:
    required: true
    description: Event type to trigger
  client_payload:
    required: false
    default: "{}"
    description: Optional payload as JSON string
runs:
  using: "composite"
  steps:
    - run: |
        echo 'Triggering ${{ inputs.repo }} with event ${{ inputs.event_type }}'
        curl -X POST https://api.github.com/repos/${{ inputs.repo }}/dispatches \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ inputs.token }}" \
          -d '{"event_type":"${{ inputs.event_type }}","client_payload":${{ inputs.client_payload }}}'
      shell: bash
