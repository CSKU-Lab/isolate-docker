name: With Compilers Workflow

on:
  push:
    paths:
      - "with-compilers/Dockerfile"
  workflow_dispatch:
  workflow_call:

env:
  IMAGE_NAME: isolate-with-compilers

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: isolate-with-compilers-test
          platforms: linux/amd64
          file: with-compilers/Dockerfile
      - name: Test Built image
        run: |
          docker run --rm --privileged isolate-with-compilers-test isolate-check-environment || true
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          file: with-compilers/Dockerfile
          tags: |
            ${{ steps.meta.outputs.tags}}
            ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
