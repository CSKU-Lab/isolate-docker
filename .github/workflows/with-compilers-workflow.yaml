name: With Compilers Workflow

on:
  push:
    paths:
      - "with-compilers/Dockerfile"
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:

env:
  IMAGE_NAME: isolate-with-compilers

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: isolate-with-compilers-test
          platforms: linux/amd64
          file: with-compilers/Dockerfile
      - name: Test Built image
        run: |
          docker run --rm --privileged isolate-with-compilers-test isolate-check-environment || true
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          file: with-compilers/Dockerfile
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      - name: Generate GitHub App token
        if: startsWith(github.ref, 'refs/tags/v')
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: CSKU-Lab
          repositories: go-grader
      - name: Trigger go-grader base image update
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/CSKU-Lab/go-grader/actions/workflows/update-base-image.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"base_image_tag\":\"${{ github.ref_name }}\"}}"
