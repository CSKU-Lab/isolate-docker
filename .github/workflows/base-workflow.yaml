name: Build and Publish Docker image
on:
  push:
    paths:
      - "base/Dockerfile"
  workflow_dispatch:

jobs:
  build-base-isolate:
    runs-on: ubuntu-latest
    steps:
      - name: get Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ vars.DOCKER_USERNAME }}/isolate
          # generate Docker tags based on the following events/attributes
          tags: |
            type=sha
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and export to Docker
        uses: docker/build-push-action@v6
        with:
          load: true
          tags: isolate-test
          platforms: linux/amd64
          file: base/Dockerfile
      - name: Test Built image
        run: |
          docker run --rm --privileged isolate-test isolate-check-environment || true
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          file: base/Dockerfile
          tags: |
            ${{ steps.meta.outputs.tags}}
            ${{ vars.DOCKER_USERNAME }}/isolate:latest
  rebuild-with-compilers:
    needs: build-base-isolate
    uses: CSKU-Lab/isolate-docker/.github/workflows/with-compilers-workflow.yaml@main
